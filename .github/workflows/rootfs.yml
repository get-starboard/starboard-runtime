name: Build and Publish Rootfs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

# One build per ref, so a pull request never cancels a build of main.
concurrency:
  group: rootfs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      url: ${{ steps.publish.outputs.url }}
      created: ${{ steps.publish.outputs.created }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate release tag
        run: echo "TAG=starboard-rootfs-$(date -u +%Y%m%d).${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Build rootfs
        env:
          # Baked into /etc/starboard-release; surfaced in the app's Settings
          # screen via EngineSetupRepository.rootfsRelease().
          STARBOARD_RELEASE: ${{ env.TAG }}
          STARBOARD_COMMIT: ${{ github.sha }}
        run: bash build-rootfs.sh

      - name: Verify /etc/starboard-release
        run: |
          set -e
          mkdir -p /tmp/release-verify
          tar xzf rootfs.tar.gz -C /tmp/release-verify etc/starboard-release
          cat /tmp/release-verify/etc/starboard-release
          grep -q "^release=$TAG$" /tmp/release-verify/etc/starboard-release \
            || { echo "FAIL: release line does not match TAG=$TAG" >&2; exit 1; }
          grep -q "^commit=${GITHUB_SHA}$" /tmp/release-verify/etc/starboard-release \
            || { echo "FAIL: commit line does not match GITHUB_SHA" >&2; exit 1; }

      - name: Verify compat symlinks and PortMaster control dir
        run: |
          set -e
          mkdir -p /tmp/rootfs-verify
          tar xzf rootfs.tar.gz -C /tmp/rootfs-verify --wildcards \
              'usr/lib/aarch64-linux-gnu/libSDL2.so' \
              'usr/lib/aarch64-linux-gnu/libGL.so.1' \
              'usr/lib/aarch64-linux-gnu/libOpenGL.so.0' \
              'usr/lib/aarch64-linux-gnu/libGLESv2.so' \
              'usr/lib/aarch64-linux-gnu/libGLESv1_CM.so.1' \
              'usr/lib/aarch64-linux-gnu/libGLESv1_CM.so' \
              'opt/system/Tools/PortMaster'
          cd /tmp/rootfs-verify

          check_symlink() {
            if [ "$(readlink "$1")" != "$2" ]; then
              echo "FAIL: $1 -> $(readlink "$1") (expected -> $2)" >&2
              exit 1
            fi
            echo "ok: $1 -> $2"
          }
          check_symlink usr/lib/aarch64-linux-gnu/libSDL2.so      libSDL2-2.0.so.0
          check_symlink usr/lib/aarch64-linux-gnu/libGL.so.1      libOSMesa.so.8
          check_symlink usr/lib/aarch64-linux-gnu/libOpenGL.so.0  libOSMesa.so.8
          check_symlink usr/lib/aarch64-linux-gnu/libGLESv2.so    libGLESv2.so.2
          check_symlink usr/lib/aarch64-linux-gnu/libGLESv1_CM.so.1 libOSMesa.so.8
          check_symlink usr/lib/aarch64-linux-gnu/libGLESv1_CM.so   libOSMesa.so.8
          check_symlink opt/system/Tools/PortMaster/xdelta3       /usr/bin/xdelta3
          check_symlink opt/system/Tools/PortMaster/7zzs.aarch64  /usr/bin/7zz
          [ -d opt/system/Tools/PortMaster/libs ]  || { echo "FAIL: missing libs/" >&2; exit 1; }
          [ -d opt/system/Tools/PortMaster/utils ] || { echo "FAIL: missing utils/" >&2; exit 1; }
          echo "all PortMaster compat symlinks/dirs present"

      - name: Verify system libraries ports link without bundling
        run: |
          set -e
          mkdir -p /tmp/libs-verify
          tar xzf rootfs.tar.gz -C /tmp/libs-verify --wildcards \
              'usr/lib/aarch64-linux-gnu/libspeexdsp.so.1*'
          [ -e /tmp/libs-verify/usr/lib/aarch64-linux-gnu/libspeexdsp.so.1 ] \
            || { echo "FAIL: missing libspeexdsp.so.1" >&2; exit 1; }
          echo "ok: libspeexdsp.so.1"

      - name: Verify the X server Westonpack games run on
        run: |
          set -e
          mkdir -p /tmp/x-verify
          tar xzf rootfs.tar.gz -C /tmp/x-verify --wildcards \
              'usr/bin/Xvfb' 'usr/bin/matchbox-window-manager' \
              'usr/lib/aarch64-linux-gnu/libXtst.so.6*'
          for f in usr/bin/Xvfb usr/bin/matchbox-window-manager \
                   usr/lib/aarch64-linux-gnu/libXtst.so.6; do
            [ -e "/tmp/x-verify/$f" ] || { echo "FAIL: missing $f" >&2; exit 1; }
            echo "ok: $f"
          done

      - name: Verify the GPU-mode GL libraries are real Mesa builds
        run: |
          set -e
          mkdir -p /tmp/virgl-verify
          tar xzf rootfs.tar.gz -C /tmp/virgl-verify \
              'opt/sb-virgl/lib/libGL.so.1' 'opt/sb-virgl/lib/libGLESv1_CM.so.1'
          for lib in libGL.so.1 libGLESv1_CM.so.1; do
            soname=$(readelf -d "/tmp/virgl-verify/opt/sb-virgl/lib/$lib" \
                | sed -n 's/.*Library soname: \[\(.*\)\]/\1/p')
            [ "$soname" = "$lib" ] \
              || { echo "FAIL: opt/sb-virgl/lib/$lib has soname '$soname'" >&2; exit 1; }
            echo "ok: opt/sb-virgl/lib/$lib"
          done

      - name: Start Xvfb and matchbox in the image
        # As Starboard's westonwrap.sh runs them: Xvfb with the real libGL
        # preloaded, since libGL.so.1 is redirected to OSMesa, which lacks the
        # glX symbols Xvfb links against.
        run: |
          docker run --rm --platform linux/arm64 starboard-rootfs:latest sh -c '
            LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libGL.so.1.7.0 \
              Xvfb :5 -nolisten tcp -screen 0 640x480x24 &
            for i in $(seq 60); do
              [ -S /tmp/.X11-unix/X5 ] && break
              sleep 1
            done
            [ -S /tmp/.X11-unix/X5 ] || { echo "FAIL: Xvfb did not start" >&2; exit 1; }
            DISPLAY=:5 timeout 10 matchbox-window-manager -use_titlebar no &
            sleep 5
            kill -0 $! || { echo "FAIL: matchbox-window-manager exited" >&2; exit 1; }
            echo "ok: Xvfb and matchbox-window-manager run"'

      - name: Rename artifact
        if: github.event_name != 'pull_request'
        run: mv rootfs.tar.gz starboard-rootfs.tar.gz

      - name: Generate SHA-256 sidecar
        if: github.event_name != 'pull_request'
        # The app downloads <asset>.sha256 next to the tarball and verifies
        # the download (EngineSetupRepository in the app repo). Missing
        # sidecar is non-fatal there, so releases predating this keep working.
        run: sha256sum starboard-rootfs.tar.gz > starboard-rootfs.tar.gz.sha256

      - name: Publish release to public repo
        id: publish
        if: github.event_name != 'pull_request'
        env:
          # Fine-grained PAT scoped to get-starboard/starboard-runtime with
          # Contents: read+write. Stored in this private repo as
          # RELEASE_REPO_TOKEN. Mirrors the app repo's release flow: source
          # builds here (private), the rootfs asset is published to the
          # public org repo the app downloads from.
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_REPO: get-starboard/starboard-runtime
        run: |
          CREATED=false
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" starboard-rootfs.tar.gz starboard-rootfs.tar.gz.sha256 \
              --repo "$RELEASE_REPO" --clobber
          else
            gh release create "$TAG" starboard-rootfs.tar.gz starboard-rootfs.tar.gz.sha256 \
              --repo "$RELEASE_REPO" \
              --title "$TAG" \
              --notes "Automated rootfs build from commit ${{ github.sha }}" \
              --latest
            CREATED=true
          fi
          {
            echo "tag=$TAG"
            echo "url=https://github.com/$RELEASE_REPO/releases/tag/$TAG"
            echo "created=$CREATED"
          } >> "$GITHUB_OUTPUT"

  # Separate from build-and-publish so a Discord failure leaves the release
  # published, and "Re-run failed jobs" retries only the post. The tag comes
  # from the job output: a retry bumps run_attempt, which the tag contains.
  announce:
    name: Announce Release On Discord
    needs: build-and-publish
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build-and-publish.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          TAG: ${{ needs.build-and-publish.outputs.tag }}
          RELEASE_URL: ${{ needs.build-and-publish.outputs.url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL is not configured" >&2
            exit 1
          fi
          jq -n --arg tag "$TAG" --arg url "$RELEASE_URL" '
            {content: "**Starboard runtime \($tag) has dropped!** 🚀\n\($url)",
             allowed_mentions: {parse: []}}' |
            curl -fsS -H 'Content-Type: application/json' --data @- "$WEBHOOK_URL"
